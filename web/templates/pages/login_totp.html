{{define "content"}}
<div class="card auth-card">
  <div class="brand big"><span class="brand-mark" aria-hidden="true"></span>Noema</div>
  <p class="muted">Enter the six-digit code from your authenticator app, or one of your recovery codes.</p>
  <form method="post" action="/login/totp" class="stack">
    <input type="hidden" name="_csrf" value="{{.CSRF}}">
    <input type="hidden" name="next" value="{{.Data.Next}}">
    <label>Code <input name="code" inputmode="numeric" autocomplete="one-time-code" required autofocus maxlength="24"></label>
    {{with .Data.Error}}<p class="error" role="alert">{{.}}</p>{{end}}
    <button class="btn btn-primary" type="submit">Continue</button>
    <p class="muted small"><a href="/login">Start over</a></p>
  </form>
</div>
{{end}}
