# Development stack: PostgreSQL with pgvector, and Noema.
# `make dev-db` starts only the database; `docker compose -f deploy/docker-compose.yml up` starts both.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: noema
      POSTGRES_PASSWORD: noema      # development only; override in production
      POSTGRES_DB: noema
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - noema-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noema"]
      interval: 5s
      timeout: 3s
      retries: 20

  noema:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      NOEMA_HTTP_ADDR: 0.0.0.0:8080
      NOEMA_DATABASE_URL: postgres://noema:noema@db:5432/noema?sslmode=disable
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - noema-research:/research
    profiles: ["app"]

volumes:
  noema-pgdata:
  noema-research:
